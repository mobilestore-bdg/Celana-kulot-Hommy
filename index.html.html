  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #25D366;
      --dark:   #0a0f0d;
      --mid:    #111a14;
      --card:   #162019;
      --text:   #e8f5ea;
      --muted:  #7aab85;
      --accent: #34eb78;
    }

    html, body {
      height: 100%;
      font-family: 'Sora', sans-serif;
      background: var(--dark);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ---- background grain + glow ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, rgba(37,211,102,.13) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(52,235,120,.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid rgba(37,211,102,.18);
      border-radius: 24px;
      padding: 52px 44px 44px;
      max-width: 400px;
      width: 90vw;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(37,211,102,.06),
        0 32px 80px rgba(0,0,0,.6),
        0 0 60px rgba(37,211,102,.08);
      animation: fadeUp .6s ease both;
    }

    @keyframes fadeUp {
      from { opacity:0; transform: translateY(24px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ---- WA icon ---- */
    .wa-icon {
      width: 72px;
      height: 72px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 0 32px rgba(37,211,102,.45);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 28px rgba(37,211,102,.4); }
      50%      { box-shadow: 0 0 52px rgba(37,211,102,.75); }
    }
    .wa-icon svg { width: 38px; height: 38px; fill: #fff; }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -.01em;
      margin-bottom: 10px;
      color: var(--text);
    }

    p.sub {
      font-size: .88rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    /* ---- progress bar ---- */
    .bar-wrap {
      background: rgba(255,255,255,.06);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--accent));
      border-radius: 99px;
      transition: width .05s linear;
    }

    .counter {
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: 32px;
      font-weight: 300;
    }
    .counter span {
      color: var(--accent);
      font-weight: 600;
    }

    /* ---- CTA button ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--green);
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: .92rem;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 99px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s;
      box-shadow: 0 4px 20px rgba(37,211,102,.3);
    }
    .btn:hover {
      background: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(37,211,102,.5);
    }
    .btn svg { width: 18px; height: 18px; fill: #fff; flex-shrink: 0; }

    .note {
      margin-top: 20px;
      font-size: .75rem;
      color: rgba(122,171,133,.5);
    }
  </style>
</head>

<script>
  // ---- Countdown + progress bar ----
  const WA_URL = "https://wa.me/6281221700211?text=Halo%2C%20saya%20tertarik%20dengan%20produk%20Anda";
  const DURATION = 3000; // ms
  const INTERVAL = 50;   // ms tick

  const bar       = document.getElementById('bar');
  const countdown = document.getElementById('countdown');
  let elapsed = 0;

  const timer = setInterval(() => {
    elapsed += INTERVAL;
    const pct = Math.min((elapsed / DURATION) * 100, 100);
    bar.style.width = pct + '%';

    const secsLeft = Math.ceil((DURATION - elapsed) / 1000);
    countdown.textContent = secsLeft > 0 ? secsLeft : 0;

    if (elapsed >= DURATION) {
      clearInterval(timer);
      window.location.href = WA_URL;
    }
  }, INTERVAL);
</script>
